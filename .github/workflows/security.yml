name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: npm audit (moderate+)
        run: npm audit --audit-level=moderate

      - name: Verify RLS script includes Attachment
        run: grep -q 'Attachment' prisma/enable_rls.sql
